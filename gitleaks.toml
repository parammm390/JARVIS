title = "FINNOR gitleaks extensions"

# Keep the complete upstream rule set. The allowlist below is deliberately
# scoped to exact synthetic test/evidence values and the browser-publishable
# Supabase key used by the public marketing build; it never exempts a whole file.
[extend]
useDefault = true

[[allowlists]]
description = "Public Supabase browser keys are intentionally publishable"
regexes = ['''sb_publishable_[A-Za-z0-9_-]+''']

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Exact seeded Vapi phone id in the authenticated audit fixture"
  condition = "AND"
  paths = ['''evidence/system-audit-authenticated/matrix\.json$''']
  regexes = ['''2512a4df-6eae-49c0-8964-2e76b398d27e''']

  [[rules.allowlists]]
  description = "Exact Bedrock test marker in the isolated provider fault fixture"
  condition = "AND"
  paths = ['''finnor-os/tests/unit/p2-llm-faults\.test\.ts$''']
  regexes = ['''phase2-test-bedrock''']

  [[rules.allowlists]]
  description = "Exact replay attempt marker in the causal replay fixture"
  condition = "AND"
  paths = ['''finnor-os/tests/integration/causal-replay\.test\.ts$''']
  regexes = ['''phase5-certification|replay''']
