# Railway/Render-class deployment for the long-running processes (§24) — a serverless
# function cannot hold a persistent worker loop.
# Render blueprint format (render.yaml-compatible); adapt names for Railway as needed.
services:
  - type: worker
    name: finnor-worker
    runtime: node
    rootDir: finnor-os
    buildCommand: npm ci
    startCommand: npm run dev:worker -- --no-watch || npx tsx apps/worker/src/index.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOHIGHLEVEL_API_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false
      # Provider env vars above are legacy-only and inert unless an exact tenant id
      # is explicitly listed here. New tenants use tenant_integrations secret refs.
      - key: FINNOR_LEGACY_CREDENTIAL_TENANT_IDS
        sync: false
      - key: FINNOR_TENANT_SECRET_PREFIX
        value: finnor/tenants
      - key: FINNOR_SYSTEM_CREDENTIAL_PROVIDERS
        value: resend
      - key: GROQ_API_KEY
        sync: false
  - type: web
    name: finnor-orchestrator
    runtime: node
    rootDir: finnor-os
    buildCommand: npm ci
    startCommand: npx tsx apps/orchestrator/src/index.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
