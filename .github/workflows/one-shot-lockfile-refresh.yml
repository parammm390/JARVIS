name: one-shot-lockfile-refresh

on:
  push:
    branches:
      - fix/preflight-release-failures-20260902

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'Regenerate patched dependency lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preflight-release-failures-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - name: Regenerate lockfile from patched overrides
        working-directory: finnor-os
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify only lockfile changed
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          test "$changed" = "finnor-os/package-lock.json" || {
            echo "Unexpected generated changes:"
            git status --short
            exit 1
          }
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finnor-os/package-lock.json
          git commit -m "Regenerate patched dependency lockfile"
          git push origin HEAD:fix/preflight-release-failures-20260902
