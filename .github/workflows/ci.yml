# CI (§29): lint/typecheck + vitest on every PR. Production deployment is owned by
# production-release.yml and its commit-locked Phase 5 readiness/release job graph.
# NOTE: this repo lives at finnor-os/ inside the FINNOR repository, so paths are scoped.
name: finnor-os-ci
on:
  pull_request:
    paths:
      - "finnor-os/**"
      - ".github/workflows/**"
      - "infra/deployment/**"
      - "scripts/release/**"
      - "package.json"
      - "package-lock.json"
      - "JARVIS-CREDENTIALS-LEDGER.md"
  push:
    branches: [main]
    paths:
      - "finnor-os/**"
      - ".github/workflows/**"
      - "infra/deployment/**"
      - "scripts/release/**"
      - "package.json"
      - "package-lock.json"
      - "JARVIS-CREDENTIALS-LEDGER.md"
defaults:
  run:
    working-directory: finnor-os
jobs:
  deployment-truth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run release:truth
      - run: npm run test:release

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      REDIS_URL: redis://localhost:6379
      AUTH_DEV_BYPASS: "1"
      # Keep exact phase certification on the P2 closure branch. The canonical
      # production branch and main instead prove that the immutable P0-P4 phase
      # commits and certified P4 tree survive the release reconciliation exactly.
      FINNOR_CERTIFICATION_CLOSURE: ${{ github.head_ref == 'codex/p2-operational-effect-system-closure' && '1' || '0' }}
      FINNOR_CERTIFICATION_RELEASE_LINEAGE: "0"
      FINNOR_CERTIFICATION_P0_P6_LINEAGE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Select the highest immutable descendant proof present in the exact tree.
      # Historical phase certifiers remain unchanged and the P0-P4 adapter still
      # owns descendants that have not incorporated P5/P6.
      - name: Select immutable descendant certification
        working-directory: .
        shell: bash
        run: |
          if git merge-base --is-ancestor 39a114f963b46b2abfde3420037395dfb95610cc HEAD; then
            if test -f finnor-os/architecture/p6/final-lineage.json; then
              echo "FINNOR_CERTIFICATION_P0_P6_LINEAGE=1" >> "$GITHUB_ENV"
            else
              echo "FINNOR_CERTIFICATION_RELEASE_LINEAGE=1" >> "$GITHUB_ENV"
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci
      # B7.T1: route guards are inventory, not tribal knowledge. Fail before tests
      # whenever a route is added or its visible guard pattern changes without the
      # generated review document being refreshed in the same change.
      - run: npm run authz:matrix:check
      - run: npm run openapi
      - run: npm run typecheck
      - run: npm run test:planner-evals
      - run: npm run db:migrate
      - run: npm run db:seed
      # setup.ts's own header comment already documented this as "run once in CI right
      # after db:migrate" -- it just never actually got added here. Local dev never hit
      # this gap because the embedded dev Postgres data directory persists across runs,
      # so the schema was already there from some earlier session; a truly fresh
      # database (this runner's ephemeral container) never got it, and
      # dealer-zero-e2e.test.ts failed on this repo's first-ever real CI run with
      # `relation "finnor_langgraph.checkpoints" does not exist`.
      - run: npm run setup:langgraph
      - name: Verify immutable P0-P4 production lineage
        if: env.FINNOR_CERTIFICATION_RELEASE_LINEAGE == '1'
        run: npm run release:p0-p4-lineage --prefix ..
      - name: Verify immutable P0-P6 production lineage
        if: env.FINNOR_CERTIFICATION_P0_P6_LINEAGE == '1'
        run: |
          npm run p6:lineage
          npm run p5:certify
          npm run p6:certify
          npm run test:p0-p6:replay
      - run: npm test
      # Phase 6 (§6.3): the real dump/restore round-trip this repo's backup-restore
      # runbook documents as blocked on Postgres client tools — this runner has them
      # (or apt provides them), so it runs for real here instead of staying a
      # documented-but-never-executed script. This proves the LOCAL/CI mechanics tier
      # (docs/backup-restore-runbook.md); it is NOT the full production-Supabase-into-
      # isolated-project drill, which needs a second Supabase project (owner action,
      # see docs/owner-actions.md).
      - name: Install Postgres client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npx tsx scripts/backup-restore-drill.ts
