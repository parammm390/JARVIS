name: release-tail-preflight

on:
  pull_request:
    paths:
      - ".github/workflows/production-release.yml"
      - ".github/workflows/release-tail-preflight.yml"
      - ".github/scripts/certification-aws-hardening.cjs"
      - "scripts/release/refresh-product-truth-auth.mjs"
      - "scripts/release/release-policy.test.mjs"
      - "finnor-os/scripts/p6/verify-descendant-lineage.ts"

permissions:
  contents: read
  id-token: write

jobs:
  production-tail-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AWS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || 'arn:aws:iam::601804670058:role/finnor-github-actions-deploy' }}
      AWS_REGION: us-east-1
      PRODUCT_TRUTH_AUTH_BEARER: ${{ secrets.TENANT_PROBE_A_JWT }}
      PRODUCT_TRUTH_OTHER_AUTH_BEARER: ${{ secrets.TENANT_PROBE_B_JWT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json

      - name: Require read-only production preflight credentials
        run: |
          for name in VERCEL_TOKEN AWS_ROLE_ARN PRODUCT_TRUTH_AUTH_BEARER PRODUCT_TRUTH_OTHER_AUTH_BEARER; do
            test -n "${!name:-}" || { echo "::error::$name is missing from the production environment"; exit 1; }
          done

      - name: Install release helper dependencies
        run: npm ci --no-audit --no-fund
        working-directory: finnor-os

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Pull protected production API environment read-only
        run: |
          VERCEL_ORG_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.organizationId")"
          VERCEL_PROJECT_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.projectId")"
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        working-directory: finnor-os/apps/api

      - name: Validate Product Truth production auth chain read-only
        run: |
          set -euo pipefail
          node scripts/release/refresh-product-truth-auth.mjs \
            --production-env finnor-os/apps/api/.vercel/.env.production.local \
            --validate-only

      - name: Validate fresh GitHub OIDC and late ECS read permissions read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          oidc_token="$(node <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          url.searchParams.set('audience', 'sts.amazonaws.com')
          const response = await fetch(url, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(20_000),
          })
          const body = await response.json().catch(() => null)
          if (!response.ok || typeof body?.value !== 'string' || !body.value) process.exit(1)
          process.stdout.write(body.value)
          NODE
          )"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"

          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          credentials="$(aws sts assume-role-with-web-identity \
            --role-arn "$AWS_ROLE_ARN" \
            --role-session-name finnor-tail-preflight \
            --web-identity-token "$oidc_token" \
            --duration-seconds 3600 \
            --region "$AWS_REGION" \
            --output json \
            --no-cli-pager)"
          access_key="$(jq -r '.Credentials.AccessKeyId // empty' <<<"$credentials")"
          secret_key="$(jq -r '.Credentials.SecretAccessKey // empty' <<<"$credentials")"
          session_token="$(jq -r '.Credentials.SessionToken // empty' <<<"$credentials")"
          test -n "$access_key" && test -n "$secret_key" && test -n "$session_token"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$session_token"
          export AWS_ACCESS_KEY_ID="$access_key"
          export AWS_SECRET_ACCESS_KEY="$secret_key"
          export AWS_SESSION_TOKEN="$session_token"

          account="$(aws sts get-caller-identity --query Account --output text --region "$AWS_REGION" --no-cli-pager)"
          test "$account" = "601804670058"
          status="$(aws ecs describe-services \
            --cluster finnor-production \
            --services finnor-worker \
            --query 'services[0].status' \
            --output text \
            --region "$AWS_REGION" \
            --no-cli-pager)"
          test "$status" = "ACTIVE"
          task_count="$(aws ecs list-tasks \
            --cluster finnor-production \
            --service-name finnor-worker \
            --desired-status RUNNING \
            --query 'length(taskArns)' \
            --output text \
            --region "$AWS_REGION" \
            --no-cli-pager)"
          test "$task_count" -ge 1
          echo "production-tail-readonly: PASS"
