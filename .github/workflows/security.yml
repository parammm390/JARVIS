name: security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
  osv:
    name: osv-scanner
    # v2 ships reusable workflows, not a root action.yml. Calling the root as an
    # action makes GitHub reject it before the dependency scan begins.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=finnor-os/package-lock.json
