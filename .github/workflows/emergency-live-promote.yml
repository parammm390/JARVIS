name: emergency-live-promote

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  promote:
    if: github.event.issue.title == '[SHIP] promote f405 live'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_TlTo8L6Rvgb0H7uJh0G5GLDD
      EXPECTED_SHA: f40526617c7e22258c12a2b669975ddaaf33e7fc
      FRONTEND_DEPLOYMENT: https://finnor-agency-bsqdz8u2l-bloodride2-3212s-projects.vercel.app
      API_DEPLOYMENT: https://api-dgk9nzp07-bloodride2-3212s-projects.vercel.app
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Promote exact ready frontend and API artifacts
        run: |
          set -euo pipefail
          vercel promote "$FRONTEND_DEPLOYMENT" --yes --scope "$TEAM_ID" --token "$VERCEL_TOKEN"
          vercel promote "$API_DEPLOYMENT" --yes --scope "$TEAM_ID" --token "$VERCEL_TOKEN"

      - name: Verify canonical live aliases only
        run: |
          set -euo pipefail
          for i in {1..12}; do
            FRONTEND_JSON="$(curl -fsS --max-time 10 https://finnorai.com/api/release || true)"
            API_JSON="$(curl -fsS --max-time 10 https://api-psi-brown-95.vercel.app/api/release || true)"
            FRONTEND_SHA="$(printf '%s' "$FRONTEND_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commitSha||"")}catch{}})' || true)"
            API_SHA="$(printf '%s' "$API_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commitSha||"")}catch{}})' || true)"
            if [ "$FRONTEND_SHA" = "$EXPECTED_SHA" ] && [ "$API_SHA" = "$EXPECTED_SHA" ]; then
              curl -fsS --max-time 10 https://api-psi-brown-95.vercel.app/api/ready
              echo
              curl -fsS --max-time 10 https://realtime.finnorai.com/healthz
              echo
              echo "LIVE_PROMOTION_OK sha=$EXPECTED_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "canonical aliases did not converge to $EXPECTED_SHA" >&2
          exit 1
