name: dealer-zero-replay
on:
  pull_request:
    paths: ["finnor-os/**"]
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:
defaults:
  run:
    working-directory: finnor-os
jobs:
  receipt-diff:
    # The artifacts are generated by two explicitly configured staging executions of
    # the same recorded Dealer Zero day: baseline (current production-equivalent) and
    # candidate (the build under review). Missing artifacts fail closed rather than
    # pretending staging was compared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci
      - name: Compare normalized Dealer Zero receipts
        env:
          DEALER_ZERO_REPLAY_BASELINE: ${{ secrets.DEALER_ZERO_REPLAY_BASELINE }}
          DEALER_ZERO_REPLAY_CANDIDATE: ${{ secrets.DEALER_ZERO_REPLAY_CANDIDATE }}
        run: npx tsx scripts/replay-dealer-zero.ts
