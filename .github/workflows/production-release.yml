name: production-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finnor-production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  canonical-graph-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Verify migration bundle parity
        run: |
          npm run db:bundle
          git diff --exit-code packages/db/migrations-bundle.ts
        working-directory: finnor-os

      - name: Apply schema and checkpointer migrations
        run: |
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os

      - name: Verify canonical traversal and tenant isolation
        run: npm test -- --run tests/integration/canonical-company-graph.test.ts tests/integration/tenant-isolation.test.ts
        working-directory: finnor-os

  core-certification:
    needs: canonical-graph-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
      FINNOR_RELEASE_SOURCE: github-actions
      FINNOR_ENVIRONMENT: production
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
      STAGING_WORKER_URL: ${{ secrets.STAGING_WORKER_URL }}
      STAGING_ORCHESTRATOR_URL: ${{ secrets.STAGING_ORCHESTRATOR_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
      P3_STAGING_IDENTITY_CONFIRMED: "1"
      STAGING_AUTH_MODE: jwt
      CERTIFICATION_TEST_EMAILS: ${{ secrets.CERTIFICATION_TEST_EMAILS }}
      CERTIFICATION_TEST_PHONES: ${{ secrets.CERTIFICATION_TEST_PHONES }}
      P3_NO_EGRESS: "1"
      LIVE_SMOKE_ALLOWED: "0"
      COMMUNICATIONS_BINDING: emulator
      ESIGN_BINDING: emulator
      ACCOUNTING_BINDING: emulator
      PAYMENTS_BINDING: emulator
      MARKETING_BINDING: emulator
      P3_LOAD_INSTRUCTION: Show open work for this certification tenant
      P3_LOAD_JWTS_JSON: ${{ secrets.P3_LOAD_JWTS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json

      - name: Install frontend dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Derive canonical core metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "STAGING_EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"
          echo "P3_LOAD_JWTS_FILE=$RUNNER_TEMP/p3-load-jwts.json" >> "$GITHUB_ENV"
          echo "P3_LOAD_RECONCILIATION_FILE=$RUNNER_TEMP/p3-load-reconciliation.json" >> "$GITHUB_ENV"

      - name: Materialize protected load identities
        run: |
          test -n "${P3_LOAD_JWTS_JSON:-}" || {
            echo "::error::P3_LOAD_JWTS_JSON is required for core load certification."
            exit 1
          }
          printf '%s' "$P3_LOAD_JWTS_JSON" > "$P3_LOAD_JWTS_FILE"
          chmod 600 "$P3_LOAD_JWTS_FILE"

      - name: Run the full core certification once for this SHA
        run: npm run release:certify -- core --core-sha="$FINNOR_COMMIT_SHA" --store="$RUNNER_TEMP/finnor-certifications"
        working-directory: finnor-os

      - name: Retain immutable core certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finnor-core-certification-${{ github.sha }}
          path: ${{ runner.temp }}/finnor-certifications/core/corecert-*.json
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [canonical-graph-gate, core-certification]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      FINNOR_RELEASE_SOURCE: github-actions
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json

      - name: Require production credentials before any mutation
        run: |
          for name in VERCEL_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "::error::$name is missing from the production environment"; exit 1; }
          done

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Install frontend dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Verify dependency manifests remain source-locked
        run: git diff --exit-code -- package.json package-lock.json finnor-os/package.json finnor-os/package-lock.json

      - name: Validate canonical deployment truth
        run: node scripts/release/validate-deployment-truth.mjs

      - name: Release governance regression tests
        run: node --test scripts/release/release-policy.test.mjs

      - name: Download certified core identity
        uses: actions/download-artifact@v4
        with:
          name: finnor-core-certification-${{ github.sha }}
          path: ${{ runner.temp }}/finnor-core-certification

      - name: Bind deployment to the PASS core certification
        run: |
          certification="$(find "$RUNNER_TEMP/finnor-core-certification" -type f -name 'corecert-*.json' -print -quit)"
          test -n "$certification"
          certification_id="$(node -e 'const a=require(process.argv[1]); if(a.status!=="PASS") process.exit(1); process.stdout.write(a.certificationId)' "$certification")"
          echo "FINNOR_CORE_CERTIFICATION_FILE=$certification" >> "$GITHUB_ENV"
          echo "FINNOR_CORE_CERTIFICATION_ID=$certification_id" >> "$GITHUB_ENV"

      - name: Derive commit-locked release metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"
          echo "FINNOR_ENVIRONMENT=production" >> "$GITHUB_ENV"

      - name: Verify clean GitHub source and release metadata
        run: node scripts/release/verify-release.mjs

      - name: Authenticate exact Azure subscription with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Frontend quality gate
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.json
          npm run test:unit

      - name: API typecheck gate
        run: npm run typecheck
        working-directory: finnor-os

      - name: Pull protected production database configuration
        run: |
          VERCEL_ORG_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.organizationId")"
          VERCEL_PROJECT_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.projectId")"
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        working-directory: finnor-os/apps/api

      - name: Preflight every production target before mutation
        run: |
          node scripts/release/preflight-production.mjs \
            --database-env finnor-os/apps/api/.vercel/.env.production.local \
            --output-file "$RUNNER_TEMP/production-preflight.json"
          echo "FINNOR_PREFLIGHT_EVIDENCE=$RUNNER_TEMP/production-preflight.json" >> "$GITHUB_ENV"

      - name: Build commit-locked production artifacts before database mutation
        run: |
          node scripts/release/deploy-production.mjs frontend --prepare-only
          node scripts/release/deploy-production.mjs api --prepare-only
          node scripts/release/verify-release.mjs

      - name: Migrate production database
        run: npm run release:migrate:production -- apps/api/.vercel/.env.production.local
        working-directory: finnor-os

      - name: Deploy prepared frontend
        id: frontend
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs frontend --deploy-only --output-file "$RUNNER_TEMP/frontend-release.json" | tee "$RUNNER_TEMP/frontend-deploy.log"
          url="$(sed -n 's/^FINNOR_DEPLOYMENT_URL=//p' "$RUNNER_TEMP/frontend-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify frontend deployment
        run: |
          node scripts/release/verify-live-release.mjs "${{ steps.frontend.outputs.url }}" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION" "$FINNOR_CORE_CERTIFICATION_ID"
          node scripts/release/verify-live-release.mjs https://finnorai.com "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION" "$FINNOR_CORE_CERTIFICATION_ID"

      - name: Deploy prepared API
        id: api
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs api --deploy-only --output-file "$RUNNER_TEMP/api-release.json" | tee "$RUNNER_TEMP/api-deploy.log"
          url="$(sed -n 's/^FINNOR_DEPLOYMENT_URL=//p' "$RUNNER_TEMP/api-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify API deployment
        run: |
          node scripts/release/verify-live-release.mjs "${{ steps.api.outputs.url }}" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION" "$FINNOR_CORE_CERTIFICATION_ID"
          node scripts/release/verify-live-release.mjs https://api-psi-brown-95.vercel.app "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION" "$FINNOR_CORE_CERTIFICATION_ID"

      - name: Deploy Azure worker and embedded orchestrator
        run: node scripts/release/deploy-azure-worker.mjs --preflight-evidence "$FINNOR_PREFLIGHT_EVIDENCE"

      - name: Verify cross-runtime release and migration parity
        run: node scripts/release/verify-production-parity.mjs --database-env finnor-os/apps/api/.vercel/.env.production.local
