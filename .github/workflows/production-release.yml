name: production-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finnor-production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  canonical-graph-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Verify migration bundle parity
        run: |
          npm run db:bundle
          git diff --exit-code packages/db/migrations-bundle.ts
        working-directory: finnor-os

      - name: Apply schema and checkpointer migrations
        run: |
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os

      - name: Verify canonical traversal and tenant isolation
        run: npm test -- --run tests/integration/canonical-company-graph.test.ts tests/integration/tenant-isolation.test.ts
        working-directory: finnor-os

  phase5-readiness:
    needs: canonical-graph-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
      FINNOR_RELEASE_SOURCE: github-actions
      FINNOR_ENVIRONMENT: production
      # The production core profile records P3 load as explicitly deferred. The
      # full load gate remains mandatory in its dedicated non-production run.
      FINNOR_RELEASE_PROFILE: production
      NODE_ENV: test
      # The core certification database is an ephemeral CI instance. Allow only
      # the explicitly guarded certification seed; production application code
      # never runs with this flag.
      CERTIFICATION_SEED_ALLOWED: "1"
      CERTIFICATION_TEST_EMAILS: certification@example.invalid
      CERTIFICATION_TEST_PHONES: "+15550000001"
      P3_NO_EGRESS: "1"
      LIVE_SMOKE_ALLOWED: "0"
      # Production main must retain every exact certified phase commit through
      # P6. Historical phase-bound certifiers are not regenerated or weakened.
      FINNOR_CERTIFICATION_RELEASE_LINEAGE: "0"
      FINNOR_CERTIFICATION_P0_P6_LINEAGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Derive commit-locked release metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"

      - name: Materialize protected load identities
        if: env.FINNOR_RELEASE_PROFILE != 'production'
        run: |
          test -n "${P3_LOAD_JWTS_JSON:-}" || {
            echo "::error::P3_LOAD_JWTS_JSON is required for core load certification."
            exit 1
          }
          printf '%s' "$P3_LOAD_JWTS_JSON" > "$P3_LOAD_JWTS_FILE"
          chmod 600 "$P3_LOAD_JWTS_FILE"

      - name: Verify clean canonical release source
        run: npm run release:verify
        env:
          FINNOR_ENVIRONMENT: production

      - name: Verify immutable P0-P6 production lineage
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          npm run p6:lineage
          npm run p5:certify
          npm run p6:certify
          npm run test:p0-p6:replay
        working-directory: finnor-os

      - name: Apply migrations from an empty database
        run: |
          npm run db:bundle
          git diff --exit-code packages/db/migrations-bundle.ts
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os

      - name: P0-P6 type, security, runtime, and regression suite
        run: |
          npm run openapi
          npm run release:human-operability -- --check
          npm run typecheck
          npm test
          echo "FINNOR_PHASE5_SUITE_PASSED=1" >> "$GITHUB_ENV"
          npm run release:manifest
          npm run release:contract
          npm run policy:lint
        working-directory: finnor-os

      - name: Produce commit-locked FINNOR core certification
        id: core-certification
        run: |
          store="$RUNNER_TEMP/core-certifications"
          npm run release:certify -- core --core-sha="$RELEASE_COMMIT_SHA" --store="$store"
          mapfile -t artifacts < <(find "$store/core" -maxdepth 1 -type f -name 'corecert-*.json' -print)
          test "${#artifacts[@]}" -eq 1
          echo "path=${artifacts[0]}" >> "$GITHUB_OUTPUT"
        working-directory: finnor-os

      - name: Export core certification to the release job
        uses: actions/upload-artifact@v4
        with:
          name: finnor-core-certification-${{ github.sha }}
          path: ${{ steps.core-certification.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [canonical-graph-gate, phase5-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      FINNOR_RELEASE_SOURCE: github-actions
      CI: "true"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.TENANT_PROBE_VERCEL_AUTOMATION_BYPASS_SECRET }}
      PRODUCT_TRUTH_AUTH_BEARER: ${{ secrets.TENANT_PROBE_A_JWT }}
      PRODUCT_TRUTH_OTHER_AUTH_BEARER: ${{ secrets.TENANT_PROBE_B_JWT }}
      PRODUCT_TRUTH_CERTIFICATION_KEY: ${{ secrets.PRODUCT_TRUTH_CERTIFICATION_KEY }}
      PRODUCT_TRUTH_RUN_WORKER_RESTART: "1"
      PRODUCT_TRUTH_ALLOW_COMPUTER_WRITE: ${{ vars.PRODUCT_TRUTH_ALLOW_COMPUTER_WRITE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json

      - name: Require production credentials before any mutation
        run: |
          for name in VERCEL_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID PRODUCT_TRUTH_AUTH_BEARER PRODUCT_TRUTH_OTHER_AUTH_BEARER PRODUCT_TRUTH_CERTIFICATION_KEY; do
            test -n "${!name:-}" || { echo "::error::$name is missing from the production environment"; exit 1; }
          done

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Verify dependency manifests remain source-locked
        run: git diff --exit-code -- package.json package-lock.json finnor-os/package.json finnor-os/package-lock.json

      - name: Validate canonical deployment truth
        run: node scripts/release/validate-deployment-truth.mjs

      - name: Release governance regression tests
        run: npm run test:release

      - name: Derive commit-locked release metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"
          echo "FINNOR_ENVIRONMENT=production" >> "$GITHUB_ENV"

      - name: Verify clean canonical Git source
        run: node scripts/release/verify-release.mjs

      - name: Authenticate exact Azure subscription with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Frontend quality gate
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.json
          npm run test:unit
          npm run openapi --prefix finnor-os
          npm run jarvis:realtime:verify
          npm run typecheck --prefix finnor-os

      - name: API typecheck gate
        run: npm run typecheck
        working-directory: finnor-os

      - name: Download commit-locked FINNOR core certification
        uses: actions/download-artifact@v4
        with:
          name: finnor-core-certification-${{ github.sha }}
          path: ${{ runner.temp }}/finnor-core-certification

      - name: Bind core certification to production preparation
        run: |
          mapfile -t artifacts < <(find "$RUNNER_TEMP/finnor-core-certification" -type f -name 'corecert-*.json' -print)
          test "${#artifacts[@]}" -eq 1
          node -e 'const fs=require("node:fs"); const artifact=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(artifact.status!=="PASS" || artifact.canonicalCoreSha!==process.env.RELEASE_COMMIT_SHA) process.exit(1)' "${artifacts[0]}"
          echo "FINNOR_CORE_CERTIFICATION_FILE=${artifacts[0]}" >> "$GITHUB_ENV"

      - name: Pull protected production database configuration
        run: |
          VERCEL_ORG_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.organizationId")"
          VERCEL_PROJECT_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.projectId")"
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        working-directory: finnor-os/apps/api

      - name: Preflight every production target before mutation
        run: |
          node scripts/release/preflight-production.mjs \
            --database-env finnor-os/apps/api/.vercel/.env.production.local \
            --output-file "$RUNNER_TEMP/production-preflight.json"
          echo "FINNOR_PREFLIGHT_EVIDENCE=$RUNNER_TEMP/production-preflight.json" >> "$GITHUB_ENV"

      - name: Build commit-locked production artifacts before database mutation
        run: |
          node scripts/release/deploy-production.mjs frontend --prepare-only
          node scripts/release/deploy-production.mjs api --prepare-only
          node scripts/release/verify-release.mjs

      - name: Migrate production database
        run: npm run release:migrate:production -- apps/api/.vercel/.env.production.local
        working-directory: finnor-os

      - name: Stage prepared frontend without promoting production
        id: frontend
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs frontend --stage-only --output-file "$RUNNER_TEMP/frontend-release.json" | tee "$RUNNER_TEMP/frontend-deploy.log"
          url="$(sed -n 's/^FINNOR_DEPLOYMENT_URL=//p' "$RUNNER_TEMP/frontend-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify staged frontend artifact
        run: node scripts/release/verify-live-release.mjs "${{ steps.frontend.outputs.url }}" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"

      - name: Stage prepared API without promoting production
        id: api
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs api --stage-only --output-file "$RUNNER_TEMP/api-release.json" | tee "$RUNNER_TEMP/api-deploy.log"
          url="$(sed -n 's/^FINNOR_DEPLOYMENT_URL=//p' "$RUNNER_TEMP/api-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify staged API artifact
        run: node scripts/release/verify-live-release.mjs "${{ steps.api.outputs.url }}" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"

      - name: Configure canonical Azure SSE DNS and HTTPS ingress
        run: node scripts/release/configure-azure-sse-ingress.mjs

      - name: Deploy and verify Azure worker and embedded orchestrator
        run: node scripts/release/deploy-azure-worker.mjs --preflight-evidence "$FINNOR_PREFLIGHT_EVIDENCE"

      - name: Promote verified frontend artifact
        run: node scripts/release/deploy-production.mjs frontend --promote-only --deployment-url "${{ steps.frontend.outputs.url }}"

      - name: Promote verified API artifact
        run: node scripts/release/deploy-production.mjs api --promote-only --deployment-url "${{ steps.api.outputs.url }}"

      - name: Verify promoted canonical Vercel aliases
        run: |
          node scripts/release/verify-live-release.mjs https://finnorai.com "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"
          node scripts/release/verify-live-release.mjs https://api-psi-brown-95.vercel.app "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"

      - name: Verify cross-runtime release and migration parity
        run: node scripts/release/verify-production-parity.mjs --database-env finnor-os/apps/api/.vercel/.env.production.local

      - name: Install deployed browser certification runtime
        run: npx playwright install --with-deps chromium

      - name: Certify deployed Human Black-Box behavior twice
        run: |
          set -o pipefail
          for run in 1 2; do
            PRODUCT_TRUTH_CERTIFICATION_RUN="$run" node scripts/release/certify-product-truth-deployed.mjs \
              | tee "$RUNNER_TEMP/human-black-box-run-$run.json"
          done
          node scripts/release/verify-consecutive-human-certifications.mjs \
            "$RUNNER_TEMP/human-black-box-run-1.json" \
            "$RUNNER_TEMP/human-black-box-run-2.json" \
            | tee "$RUNNER_TEMP/operational-closure.json"

      - name: Preserve Human Black-Box certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-black-box-certification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/human-black-box-run-*.json
            ${{ runner.temp }}/operational-closure.json
          if-no-files-found: warn
          retention-days: 30
