name: production-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finnor-production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
      FINNOR_RELEASE_SOURCE: github-actions
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json

      - name: Derive canonical release metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"
          echo "FINNOR_ENVIRONMENT=production" >> "$GITHUB_ENV"

      - name: Require production credentials before any mutation
        run: |
          for name in VERCEL_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "::error::$name is missing from the production environment"; exit 1; }
          done

      - name: Verify clean canonical Git source
        run: node scripts/release/verify-release.mjs

      - name: Install pinned deployment CLI and dependencies
        run: |
          npm install --global vercel@50.15.1
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix finnor-os

      - name: Verify dependency manifests remain source-locked
        run: git diff --exit-code -- package.json package-lock.json finnor-os/package.json finnor-os/package-lock.json

      - name: Validate canonical deployment truth
        run: node scripts/release/validate-deployment-truth.mjs

      - name: Authenticate exact Azure subscription with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Pull protected production database configuration
        run: |
          VERCEL_ORG_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.organizationId")"
          VERCEL_PROJECT_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.projectId")"
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
        working-directory: finnor-os/apps/api

      - name: Preflight every production target before mutation
        run: |
          node scripts/release/preflight-production.mjs \
            --database-env finnor-os/apps/api/.vercel/.env.production.local \
            --output-file "$RUNNER_TEMP/production-preflight.json"
          echo "FINNOR_PREFLIGHT_EVIDENCE=$RUNNER_TEMP/production-preflight.json" >> "$GITHUB_ENV"

      - name: Release governance regression tests
        run: node --test scripts/release/release-policy.test.mjs

      - name: Verify migration bundle parity
        run: |
          npm run db:bundle
          git diff --exit-code packages/db/migrations-bundle.ts
        working-directory: finnor-os

      - name: Generate API contract used by contract tests
        run: npm run openapi
        working-directory: finnor-os

      - name: Apply local schema and checkpointer migrations
        run: |
          npm run db:migrate
          npm run db:seed
          npm run setup:langgraph
        working-directory: finnor-os

      # The complete suite includes every focused Phase 1–3/isolation test. Run it
      # once against this fresh local database: repeating DB-mutating test files in
      # the same job makes the second pass observe first-pass fixtures and is not an
      # independent release signal.
      - name: Phase 1–3, isolation, and complete FINNOR regression suite
        run: npm test
        working-directory: finnor-os

      - name: Frontend and API quality gates
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.json
          npm run test:unit
          npm run typecheck --prefix finnor-os

      - name: Build production artifacts before database mutation
        run: |
          node scripts/release/deploy-production.mjs frontend --prepare-only
          node scripts/release/deploy-production.mjs api --prepare-only
          node scripts/release/verify-release.mjs

      - name: Migrate production database
        run: npm run release:migrate:production -- apps/api/.vercel/.env.production.local
        working-directory: finnor-os

      - name: Deploy prepared frontend artifact
        run: node scripts/release/deploy-production.mjs frontend --deploy-only --output-file "$RUNNER_TEMP/frontend-release.json"

      - name: Deploy prepared API artifact
        run: node scripts/release/deploy-production.mjs api --deploy-only --output-file "$RUNNER_TEMP/api-release.json"

      - name: Deploy Azure worker and embedded orchestrator
        run: node scripts/release/deploy-azure-worker.mjs --preflight-evidence "$FINNOR_PREFLIGHT_EVIDENCE"

      - name: Verify cross-runtime release parity
        run: node scripts/release/verify-production-parity.mjs --database-env finnor-os/apps/api/.vercel/.env.production.local

      - name: Production queue, tenant-isolation, and importer smoke
        run: >-
          npx tsx scripts/release/production-smoke.ts
          apps/api/.vercel/.env.production.local
          "$FINNOR_PREFLIGHT_EVIDENCE"
        working-directory: finnor-os

      - name: Re-verify parity after smokes
        run: node scripts/release/verify-production-parity.mjs --database-env finnor-os/apps/api/.vercel/.env.production.local
